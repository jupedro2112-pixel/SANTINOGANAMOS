# ZAP Automation Framework — PLAN BASELINE (pasivo) para SANTINOGANAMOS
# ----------------------------------------------------------------------------
# Qué hace: recorre (spider) la superficie de la app logueado como admin y corre
# SOLO reglas PASIVAS (observa respuestas, no inyecta ataques). Es el primer
# barrido: cabeceras de seguridad faltantes, cookies sin flags, info expuesta,
# TLS, etc. NO prueba inyección ni lógica de negocio (eso es el plan activo).
#
# ⚠️ Aun siendo "pasivo", el SPIDER manda GET y puede enviar formularios (POST).
#    Por eso esto se corre SOLO contra una copia descartable, NUNCA contra
#    producción con jugadores reales. Ver README.md.
#
# Uso:
#   export TARGET="http://localhost:3000"
#   export ZAP_ADMIN_USER="zap_admin"
#   export ZAP_ADMIN_PASS="unaClaveDePrueba"
#   zap.sh -cmd -autorun security/zap/zap-baseline.yaml
# ----------------------------------------------------------------------------

env:
  contexts:
    - name: "santinoganamos"
      urls:
        - "${TARGET}"
      includePaths:
        - "${TARGET}/api/.*"
        - "${TARGET}/adminprivado2026/.*"
      excludePaths:
        # Endpoints que GASTAN PLATA o mandan SMS reales (AWS SNS) / push.
        # Se excluyen incluso del spider para no disparar OTP ni cargos.
        - ".*/api/auth/.*otp.*"
        - ".*/api/auth/send-register-otp.*"
        - ".*/api/auth/verify-phone/.*"
        - ".*/api/auth/change-password/send-otp.*"
        - ".*/api/admin/bulk-sms.*"
        - ".*/api/admin/users/[^/]+/verify-phone.*"
        # Webhook de acreditación bancaria (hgcash): crea plata.
        - ".*/api/hgcash/webhook.*"
        # Sesión/login contra la plataforma externa (girox/mijoker).
        - ".*/api/auth/platform-login.*"
        # Logout: evita que el spider mate la propia sesión de ZAP.
        - ".*/api/auth/logout.*"
      authentication:
        method: "json"
        parameters:
          loginPageUrl: "${TARGET}/api/auth/login"
          loginRequestUrl: "${TARGET}/api/auth/login"
          loginRequestBody: '{"username":"{%username%}","password":"{%password%}"}'
        verification:
          method: "poll"
          loggedInRegex: '"role"\s*:'
          loggedOutRegex: '"error"\s*:|HTTP/\S+\s+401'
          pollUrl: "${TARGET}/api/auth/verify"
          pollFrequency: 60
          pollUnits: "requests"
      # La app acepta Authorization: Bearer O la cookie httpOnly admin_api_session
      # (authMiddleware cae a la cookie). ZAP captura la cookie del login y la
      # reenvía: por eso alcanza con session management por cookie.
      sessionManagement:
        method: "cookie"
      users:
        - name: "admin"
          credentials:
            username: "${ZAP_ADMIN_USER}"
            password: "${ZAP_ADMIN_PASS}"
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true
  vars:
    TARGET: "http://localhost:3000"

jobs:
  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 20
      scanOnlyInScope: true

  - type: spider
    parameters:
      context: "santinoganamos"
      user: "admin"
      url: "${TARGET}"
      maxDuration: 5          # minutos
      maxDepth: 8
      maxChildren: 0          # 0 = sin tope
    tests:
      - type: stats
        name: "Al menos encontró rutas"
        onFail: "warn"
        statistic: "spider.urls.added"
        operator: ">="
        value: 10

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: report
    parameters:
      template: "traditional-html"
      reportDir: "security/zap/reports"
      reportFile: "baseline-{{yyyy-MM-dd-HH-mm}}"
      reportTitle: "SANTINOGANAMOS — ZAP baseline (pasivo)"
      displayReport: false
