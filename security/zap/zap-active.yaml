# ZAP Automation Framework — PLAN ACTIVO (ataques) para SANTINOGANAMOS
# ----------------------------------------------------------------------------
# Qué hace: spider + escaneo ACTIVO. ZAP inyecta payloads (SQLi/NoSQLi, XSS,
# inyección de comandos, path traversal, etc.) contra cada parámetro en scope.
#
# 🚨 SOLO CONTRA UNA COPIA DESCARTABLE CON DATOS DE MENTIRA. 🚨
#    El escaneo activo MODIFICA datos, puede crear/borrar registros, disparar
#    cargas/retiros y dejar basura. Nunca contra producción. Ver README.md.
#
# Los endpoints que mandan SMS/plata/webhook están excluidos igual (abajo),
# como segunda barrera por si el stub de la copia no los neutraliza.
#
# Uso:
#   export TARGET="http://localhost:3000"
#   export ZAP_ADMIN_USER="zap_admin"
#   export ZAP_ADMIN_PASS="unaClaveDePrueba"
#   zap.sh -cmd -autorun security/zap/zap-active.yaml
# ----------------------------------------------------------------------------

env:
  contexts:
    - name: "santinoganamos"
      urls:
        - "${TARGET}"
      includePaths:
        - "${TARGET}/api/.*"
        - "${TARGET}/adminprivado2026/.*"
      excludePaths:
        # --- Gastan plata o mandan SMS reales / push: NUNCA atacar ---
        - ".*/api/auth/.*otp.*"
        - ".*/api/auth/send-register-otp.*"
        - ".*/api/auth/verify-phone/.*"
        - ".*/api/auth/change-password/send-otp.*"
        - ".*/api/admin/bulk-sms.*"
        - ".*/api/admin/users/[^/]+/verify-phone.*"
        - ".*/api/admin/users/[^/]+/login-without-password.*"
        - ".*/api/hgcash/webhook.*"
        - ".*/api/auth/platform-login.*"
        - ".*/api/auth/logout.*"
        # --- Operaciones de plata: un active scan podría gatillarlas ---
        #     (ajustá estos patrones a las rutas reales de carga/retiro/bono
        #      de tu panel antes de la primera corrida; ver README.md §IDOR)
        - ".*/api/admin/.*(deposit|withdraw|carga|retiro|bonus|payout).*"
        - ".*/api/weekly-refund/claim.*"
        - ".*/api/roulette/.*claim.*"
      authentication:
        method: "json"
        parameters:
          loginPageUrl: "${TARGET}/api/auth/login"
          loginRequestUrl: "${TARGET}/api/auth/login"
          loginRequestBody: '{"username":"{%username%}","password":"{%password%}"}'
        verification:
          method: "poll"
          loggedInRegex: '"role"\s*:'
          loggedOutRegex: '"error"\s*:|HTTP/\S+\s+401'
          pollUrl: "${TARGET}/api/auth/verify"
          pollFrequency: 60
          pollUnits: "requests"
      sessionManagement:
        method: "cookie"
      users:
        # Un usuario por rol: sirve para el spider autenticado y, sobre todo,
        # para el testing manual de autorización/IDOR (ver README.md).
        - name: "admin"
          credentials:
            username: "${ZAP_ADMIN_USER}"
            password: "${ZAP_ADMIN_PASS}"
        - name: "depositor"
          credentials:
            username: "${ZAP_DEPOSITOR_USER}"
            password: "${ZAP_DEPOSITOR_PASS}"
        - name: "withdrawer"
          credentials:
            username: "${ZAP_WITHDRAWER_USER}"
            password: "${ZAP_WITHDRAWER_PASS}"
        - name: "player"
          credentials:
            username: "${ZAP_PLAYER_USER}"
            password: "${ZAP_PLAYER_PASS}"
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true
  vars:
    TARGET: "http://localhost:3000"

jobs:
  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 20
      scanOnlyInScope: true

  - type: spider
    parameters:
      context: "santinoganamos"
      user: "admin"
      url: "${TARGET}"
      maxDuration: 5
      maxDepth: 8

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: activeScan
    parameters:
      context: "santinoganamos"
      user: "admin"
      policy: "Default Policy"
      maxRuleDurationInMins: 5
      maxScanDurationInMins: 60
    # El escaneo NoSQLi (Mongo) no viene en la política por defecto: instalá el
    # add-on "Advanced SQLInjection"/"Ascan Rules Beta" y sumá la regla, o
    # corré un policy propio. Ver README.md §NoSQL.

  - type: report
    parameters:
      template: "traditional-html"
      reportDir: "security/zap/reports"
      reportFile: "active-{{yyyy-MM-dd-HH-mm}}"
      reportTitle: "SANTINOGANAMOS — ZAP active scan"
      displayReport: false
